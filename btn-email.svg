<svg xmlns="http://www.w3.org/2000/svg" width="190" height="48" viewBox="0 0 190 48" role="img" aria-label="Email Me">
<defs><linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#d14836"/><stop offset="1" stop-color="#f06292"/></linearGradient>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="2" y="2" width="186" height="44" rx="22"/></clipPath></defs>
<rect x="2" y="2" width="186" height="44" rx="22" fill="url(#b)"><animate attributeName="opacity" values="0.88;1;0.88" dur="2.6s" repeatCount="indefinite"/></rect>
<g clip-path="url(#c)"><rect y="0" width="40" height="48" fill="url(#s)" transform="skewX(-20)"><animate attributeName="x" values="-80;-80;230" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/></rect></g>
<text x="95" y="30" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" letter-spacing="0.5">Email Me</text>
</svg>